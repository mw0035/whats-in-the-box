<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What's in the box?</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<main>
  <!-- Joining -->
  <section id="intro" class="hidden">
    <h1 id="opening">What's in the box?</h1>
    <div id="nameStep">
      <p id="namePrompt"></p>
      <input id="nameInput" type="text" maxlength="30" autocomplete="nickname">
      <p><button id="nameGo" class="primary" style="width:100%"></button></p>
    </div>
    <div id="colorStep" class="hidden">
      <p id="colorCheck"></p>
      <div class="row">
        <button id="colorYes">Yes</button>
        <button id="colorNo">No</button>
      </div>
    </div>
  </section>

  <!-- Playing -->
  <section id="play" class="hidden">
    <p class="muted" id="who"></p>
    <div id="result" class="box result hidden"></div>
    <p id="puzzleLabel" class="puzzle-label hidden"></p>
    <p id="prompt" class="prompt"></p>
    <div id="hintBox" class="box hint hidden"></div>
    <p><button id="scanBtn" class="primary big hidden"></button></p>
    <p><button id="hintBtn" class="hidden" style="width:100%"></button></p>
    <div id="hintPanel" class="box hidden">
      <p id="hintQuestion"></p>
      <div class="row">
        <button id="hintYes" class="primary"></button>
        <button id="hintNo"></button>
      </div>
    </div>
    <div class="row">
      <button id="guideBtn"></button>
      <button id="notebookBtn"></button>
      <button id="pathBtn"></button>
    </div>
    <p><button id="abandonBtn" class="hidden" style="width:100%"></button></p>

    <div id="guidePanel" class="box hidden">
      <h2 id="guideTitle"></h2>
      <input id="guideSearch" type="search" placeholder="Search" autocomplete="off">
      <dl id="guideList"></dl>
    </div>

    <div id="notebookPanel" class="box hidden">
      <h2 id="notebookTitle"></h2>
      <ul id="notebookList"></ul>
      <p id="notebookEmpty" class="muted">No clues yet.</p>
    </div>

    <div id="pathPanel" class="box hidden">
      <h2 id="pathTitle"></h2>
      <div id="pathList"></div>
    </div>

    <p id="error" class="error hidden"></p>

    <div id="final" class="final hidden">
      <h2 id="finalHeading"></h2>
      <p id="finalHint" class="muted"></p>
      <button id="submitBtn" style="width:100%"></button>
      <div id="submitPanel" class="box hidden">
        <p id="submitEntry"></p>
        <input id="answer" type="text" maxlength="120" autocomplete="off">
        <p id="submitConfirm" class="hidden"></p>
        <div class="row">
          <button id="submitGo" class="primary">Submit</button>
          <button id="submitCancel">Cancel</button>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Full-screen card for a new clue or for finding the answer -->
<div id="card" class="card hidden" role="dialog" aria-modal="true">
  <div class="card-inner">
    <div id="cardText"></div>
    <button id="cardBtn" class="primary big"></button>
  </div>
</div>

<!-- In-page QR scanner -->
<div id="scanner" class="scanner hidden">
  <video id="video" playsinline muted></video>
  <p id="scanHelp"></p>
  <p id="scanMsg" class="error"></p>
  <button id="scanCancel"></button>
</div>

<script>
"use strict";
const KEY = "witb-player";
const $ = (id) => document.getElementById(id);
let creds = null, labels = {}, view = null, guideLoaded = false, confirming = false;
try { creds = JSON.parse(localStorage.getItem(KEY)); } catch (_) {}

// A scanned sheet opens /s/<code>. Take the code, then tidy the address so a refresh doesn't scan again.
let pendingScan = null;
const m = location.pathname.match(/^\/s\/([A-Za-z0-9]+)/);
if (m) { pendingScan = m[1]; history.replaceState(null, "", "/"); }

function save() { try { localStorage.setItem(KEY, JSON.stringify(creds)); } catch (_) {} }

async function api(path, body) {
  const headers = { "content-type": "application/json" };
  if (creds) { headers["x-player-id"] = creds.id; headers["x-player-token"] = creds.token; }
  const res = await fetch(path, { method: body === undefined ? "GET" : "POST", headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}

function show(id, on) { $(id).classList.toggle("hidden", !on); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
// Game text may mark ***bold italics***, **bold** and *italics*.
function fmt(s) {
  return esc(s || "").replace(/\*\*\*([^*\n]+)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
}

// Per-player memory on this phone: which card was last shown, how many clues were looked at.
const seenKey = (k) => `witb-${k}-${creds && creds.id}`;
const getSeen = (k) => { try { return Number(localStorage.getItem(seenKey(k))) || 0; } catch (_) { return 0; } };
const setSeen = (k, n) => { try { localStorage.setItem(seenKey(k), String(n)); } catch (_) {} };

function showCard(card) {
  $("cardText").innerHTML = fmt(card.text);
  $("cardText").classList.toggle("lead-bold", /^\*\*[^*]/.test(card.text || "")); // a bold opening line becomes the heading
  $("cardBtn").textContent = labels.cardButton;
  show("card", true);
  if (navigator.vibrate) navigator.vibrate([150, 80, 250]);
}

function renderNotebook(v) {
  const seen = Math.min(getSeen("notes"), v.notebook.length);
  const fresh = v.notebook.length - seen;
  $("notebookBtn").textContent = labels.notebookButton + (v.notebook.length ? ` (${v.notebook.length})` : "");
  $("notebookBtn").classList.toggle("has-new", fresh > 0);
  $("notebookList").innerHTML = v.notebook.map((t, i) =>
    `<li>${esc(t)}${i >= seen ? ` <span class="tag">${esc(labels.notebookNew)}</span>` : ""}</li>`).join("");
  $("notebookEmpty").textContent = labels.notebookEmpty; show("notebookEmpty", v.notebook.length === 0);
}

function render(v) {
  view = v;
  if (v.snap) { creds.snap = v.snap; save(); }
  show("intro", false); show("play", true);
  $("who").textContent = `${v.name} · ${v.trackLabel} · Run ${v.run}`;
  show("result", !!v.result); $("result").innerHTML = fmt(v.result);
  show("puzzleLabel", !!v.puzzleNum); $("puzzleLabel").textContent = v.puzzleNum ? labels.puzzleLabel.replace("{n}", v.puzzleNum) : "";
  $("prompt").innerHTML = fmt(v.prompt);
  show("hintBox", !!v.hint); $("hintBox").innerHTML = v.hint ? `<strong>${esc(labels.hintLabel)}</strong> ${fmt(v.hint)}` : "";
  $("hintBtn").textContent = labels.hintButton; show("hintBtn", ["available", "none", "cross"].includes(v.hintState));
  if (!["available", "none", "cross"].includes(v.hintState)) show("hintPanel", false);
  if (v.card && v.card.n > getSeen("card")) { setSeen("card", v.card.n); showCard(v.card); }
  $("guideBtn").textContent = labels.guideButton; $("notebookBtn").textContent = labels.notebookButton;
  $("pathBtn").textContent = labels.pathButton; $("pathTitle").textContent = labels.pathButton;
  $("scanBtn").textContent = labels.scanButton; show("scanBtn", v.canScan);
  $("finalHeading").textContent = labels.finalHeading; $("finalHint").textContent = labels.finalHint;
  $("submitBtn").textContent = labels.submitButton;
  $("abandonBtn").textContent = labels.abandonButton;
  show("final", v.status === "playing" && !v.submission);
  show("abandonBtn", v.canAbandon);
  if (!(v.status === "playing" && !v.submission)) show("submitPanel", false);
  renderPath(v.path || []);
  renderNotebook(v);
  $("guideTitle").textContent = `${v.trackLabel} ${labels.guideButton.toLowerCase()}`;
  $("notebookTitle").textContent = labels.notebookButton;
  if (v.error) { $("error").textContent = v.error; show("error", true); } else show("error", false);
}

async function refresh() {
  if (!creds) return showIntro();
  let r = await api("/api/me");
  if (r.status === 401 && creds.snap) r = await api("/api/restore", { snap: creds.snap });
  if (r.status !== 200) { creds = null; try { localStorage.removeItem(KEY); } catch (_) {} return showIntro(); }
  render(r.data);
}

async function showIntro() {
  const r = await api("/api/intro");
  $("opening").textContent = r.data.opening; $("colorCheck").textContent = r.data.colorCheck;
  $("namePrompt").textContent = labels.namePrompt; $("nameGo").textContent = labels.nameContinue;
  $("colorYes").disabled = $("colorNo").disabled = false;
  show("nameStep", true); show("colorStep", false); show("card", false);
  show("play", false); show("intro", true);
}

async function join(colorTrouble) {
  $("colorYes").disabled = $("colorNo").disabled = true;
  const r = await api("/api/join", { colorTrouble, name: $("nameInput").value.trim() });
  creds = { id: r.data.id, token: r.data.token, snap: r.data.snap }; save();
  render(r.data);
  if (pendingScan) { const code = pendingScan; pendingScan = null; scan(code); }
}

async function scan(code) {
  const r = await api("/api/scan", { code });
  if (r.status === 200) render(r.data); else refresh();
  show("guidePanel", false); show("notebookPanel", false); show("pathPanel", false); show("hintPanel", false);
  window.scrollTo(0, 0);
}

// Newest first, grouped by run. Each step says where the player scanned and what happened.
function renderPath(path) {
  if (!path.length) { $("pathList").innerHTML = `<p class="muted">${esc(labels.pathEmpty)}</p>`; return; }
  const runs = [...new Set(path.map((x) => x.run))].sort((a, b) => b - a);
  $("pathList").innerHTML = runs.map((r) => {
    const items = path.filter((x) => x.run === r).map((x, k) => {
      const showAsked = x.asked && !["start", "stillCold", "resume"].includes(x.o);
      return `<li value="${k + 1}"><b>${esc(x.place)}</b>${x.place ? " · " : ""}${esc(x.what)}` +
        (showAsked ? `<br><span class="muted">${fmt(labels.pathAsked.replace("{asked}", x.asked))}</span>` : "") + "</li>";
    }).reverse().join("");
    return (runs.length > 1 ? `<h3>${esc(labels.pathRun.replace("{r}", r))}</h3>` : "") + `<ol reversed class="path">${items}</ol>`;
  }).join("");
}

// ---------------------------------------------------------------- in-page QR scanner
let stream = null, scanTimer = null, jsQRLoading = null;
const frame = document.createElement("canvas");
const frameCtx = frame.getContext("2d", { willReadFrequently: true });

function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return jsQRLoading = jsQRLoading || new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = "/vendor/jsQR.js"; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

// Sheet QR codes hold an address ending in /s/<code>.
function codeFrom(text) {
  try { const m = new URL(text, location.href).pathname.match(/^\/s\/([A-Za-z0-9]+)/); if (m) return m[1]; } catch (_) {}
  return String(text).slice(0, 100);
}

async function openScanner() {
  $("scanHelp").textContent = labels.scanHelp; $("scanCancel").textContent = labels.scanCancel;
  $("scanMsg").textContent = "";
  show("scanner", true);
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no camera");
    await loadJsQR();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (_) { $("scanMsg").textContent = labels.scanNoCamera; return; }
  if ($("scanner").classList.contains("hidden")) return closeScanner(); // cancelled while waiting for permission
  const v = $("video"); v.srcObject = stream;
  await v.play().catch(() => {});
  scanTimer = setInterval(readFrame, 200);
}

function readFrame() {
  const v = $("video");
  if (v.readyState < 2 || !v.videoWidth) return;
  const k = Math.min(1, 640 / v.videoWidth);
  const w = frame.width = Math.round(v.videoWidth * k), h = frame.height = Math.round(v.videoHeight * k);
  frameCtx.drawImage(v, 0, 0, w, h);
  const hit = window.jsQR(frameCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
  if (!hit || !hit.data) return;
  if (navigator.vibrate) navigator.vibrate(60);
  closeScanner();
  scan(codeFrom(hit.data));
}

function closeScanner() {
  clearInterval(scanTimer); scanTimer = null;
  if (stream) { for (const t of stream.getTracks()) t.stop(); stream = null; }
  $("video").srcObject = null;
  show("scanner", false);
}

function toggle(panel) {
  for (const p of ["guidePanel", "notebookPanel", "pathPanel", "submitPanel"]) if (p !== panel) show(p, false);
  show(panel, $(panel).classList.contains("hidden"));
}

async function loadGuide() {
  if (guideLoaded) return;
  const r = await api("/api/guide");
  if (r.status !== 200) return;
  guideLoaded = true;
  $("guideList").innerHTML = r.data.entries.map((e) => `<div class="entry" data-t="${esc(e.term.toLowerCase())}"><dt><b>${esc(e.term)}</b></dt><dd>${fmt(e.note)}</dd></div>`).join("");
}

$("nameGo").onclick = () => { show("nameStep", false); show("colorStep", true); };
$("nameInput").onkeydown = (e) => { if (e.key === "Enter") $("nameGo").click(); };
$("colorYes").onclick = () => join(true);
$("colorNo").onclick = () => join(false);
$("cardBtn").onclick = () => show("card", false);
$("guideBtn").onclick = async () => { await loadGuide(); toggle("guidePanel"); };
$("notebookBtn").onclick = () => {
  toggle("notebookPanel");
  if (view && !$("notebookPanel").classList.contains("hidden")) setTimeout(() => { setSeen("notes", view.notebook.length); renderNotebookBadge(); }, 0);
};
// Opening the notebook clears the highlight on the button; the New tags stay until the next screen update.
function renderNotebookBadge() { $("notebookBtn").classList.remove("has-new"); }

// Hints: confirm before spending one; cross-track puzzles and "none left" just explain.
let hintAction = null;
$("hintBtn").onclick = () => {
  if (!view) return;
  const st = view.hintState;
  if (st === "available") {
    $("hintQuestion").textContent = labels.hintConfirm.replace("{left}", view.hintsLeft).replace("{total}", view.hintsTotal);
    $("hintYes").textContent = labels.hintYes; $("hintNo").textContent = labels.hintNo;
    show("hintYes", true); hintAction = "use";
  } else {
    $("hintQuestion").textContent = st === "cross" ? labels.hintCrossTrack : labels.hintNone;
    $("hintNo").textContent = labels.cardButton; show("hintYes", false); hintAction = null;
  }
  show("hintPanel", true);
};
$("hintNo").onclick = () => show("hintPanel", false);
$("hintYes").onclick = async () => {
  show("hintPanel", false);
  if (hintAction !== "use") return;
  const r = await api("/api/hint", {});
  if (r.status === 200) render(r.data);
};
$("pathBtn").onclick = () => toggle("pathPanel");
$("scanBtn").onclick = openScanner;
$("scanCancel").onclick = closeScanner;
$("guideSearch").oninput = () => {
  const q = $("guideSearch").value.trim().toLowerCase();
  for (const el of document.querySelectorAll("#guideList .entry")) el.classList.toggle("hidden", !!q && !el.dataset.t.includes(q));
};
$("submitBtn").onclick = () => {
  confirming = false; show("submitConfirm", false); $("submitGo").textContent = "Submit";
  $("submitEntry").textContent = labels.submitEntry; toggle("submitPanel"); $("answer").focus();
};
$("submitCancel").onclick = () => { confirming = false; show("submitPanel", false); };
$("submitGo").onclick = async () => {
  const answer = $("answer").value.trim();
  if (!answer) return;
  if (!confirming) {
    confirming = true;
    $("submitConfirm").textContent = labels.submitConfirm.replace("{answer}", answer);
    show("submitConfirm", true); $("submitGo").textContent = "Yes, submit";
    return;
  }
  const r = await api("/api/submit", { answer });
  confirming = false; show("submitPanel", false);
  if (r.status === 200) render(r.data); else refresh();
};
$("abandonBtn").onclick = async () => { const r = await api("/api/abandon", {}); if (r.status === 200) render(r.data); };

// Keep the screen current (run starts, reveals) without interrupting typing.
setInterval(() => {
  if (document.hidden || !creds || stream) return;
  if (document.activeElement && ["answer", "guideSearch"].includes(document.activeElement.id)) return;
  refresh();
}, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && creds) refresh(); });

(async () => {
  labels = (await api("/api/labels")).data;
  if (creds) { await refresh(); if (pendingScan && creds) { const c = pendingScan; pendingScan = null; scan(c); } }
  else showIntro();
})();
</script>
</body>
</html>
